version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must match the runtime in .nvmrc (Node 24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Majors that need a deliberate migration (eslint-config-next and the
      # Next.js TypeScript plugin must support them first).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
