name: Deploy

# On merge to main: apply migrations, then deploy the app to Vercel
# production. Vercel's own Git deploy for main is turned off in vercel.json so
# the app never goes live before its migrations.
#
# ADR-014: one Supabase project serves staging and production for now, so
# there is a single migrate step and dev fixtures are never applied.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --include-all
      - name: Apply wedge city (never dev fixtures, see ADR-014)
        run: psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -q -f supabase/seed/wedge-city.sql

  deploy:
    name: Deploy to Vercel production
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Build on Vercel (not --prebuilt) so sensitive env vars, which cannot be
      # pulled to CI, are available to the build.
      - run: npx --yes vercel@62 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
