name: E2E on preview

# Vercel reports each deployment to GitHub. Run the Playwright journeys
# against every successful preview deployment (backed by the staging project).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CI: true
    steps:
      # Previews sit behind Vercel Deployment Protection (they use the shared
      # production database, ADR-014). Without the bypass secret the tests
      # would only see the Vercel login page.
      - name: Check protection bypass secret
        id: bypass
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set; skipping preview E2E."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.bypass.outputs.ready == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        if: steps.bypass.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.bypass.outputs.ready == 'true'
        run: npm ci
      - if: steps.bypass.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.bypass.outputs.ready == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure() && steps.bypass.outputs.ready == 'true'
        with:
          name: playwright-report-preview
          path: playwright-report
          retention-days: 7
