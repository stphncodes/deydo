<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f7f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #0b1320;
    "
  >
    <table
      role="presentation"
      width="100%"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e3e6eb;
        border-radius: 14px;
      "
    >
      <tr>
        <td style="padding: 24px">
          <p style="margin: 0 0 8px; font-size: 18px; font-weight: bold">Your sign-in code</p>
          <p style="margin: 0 0 16px; color: #4b5565">
            Enter this code in DeyDo to sign in. It works for 10 minutes.
          </p>
          <p style="margin: 0 0 16px; font-size: 32px; font-weight: bold; letter-spacing: 6px">
            {{ .Token }}
          </p>
          <p style="margin: 0; color: #6b7280; font-size: 14px">
            If you did not ask for this, you can ignore this email. Never share this code with
            anyone, including people who say they work for DeyDo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
